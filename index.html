<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Litgrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: effect bench — stage on the left (sticky while scrolling), controls on the right; stacks on mobile.
   The frame follows the chosen background: dark by default, light (.light) when the effect background is light. */
:root {
  --bg: #0a0b13;
  --panel: #11121c;
  --line: #22243a;
  --fg: #ebe7e1;
  --muted: #8d8b9c;
  --accent: #e2672b;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
/* the frame follows the effect background: light theme when the chosen background is light */
:root.light {
  --bg: #f5f3f0;
  --panel: #ffffff;
  --line: #e0dbd5;
  --fg: #1f1b18;
  --muted: #6e6862;
  --accent: #c2410c;
  color-scheme: light;
}
:root.light button.primary { color: #ffffff; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 16px; }
h1 { font: 800 clamp(18px, 2.4vw, 24px)/1.1 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 70ch; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 1000px) { .app { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } .stage-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.stage-wrap { display: grid; gap: 10px; min-width: 0; }
.stage { display: grid; place-items: center; background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 160px; }
#stage { display: block; max-width: 100%; max-height: 72vh; width: auto; height: auto; image-rendering: auto; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stat { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
button, .file {
  font: 500 13px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 5px; padding: 7px 11px; cursor: pointer;
}
button:hover, .file:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #140803; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file { position: relative; display: inline-block; }
.panel { display: grid; gap: 8px; min-width: 0; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
summary { cursor: pointer; padding: 10px 12px; font: 600 11px var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "+"; font-family: var(--mono); }
details[open] summary::after { content: "–"; }
.fields { display: grid; gap: 10px; padding: 2px 12px 14px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.row label { color: var(--fg); }
.row output { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row input[type=range], .row select, .row input[type=text] { grid-column: 1 / -1; width: 100%; }
input[type=range] { accent-color: var(--accent); }
textarea { grid-column: 1 / -1; width: 100%; resize: vertical; font: 12px/1.4 var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.svg-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.svg-actions button { padding: 5px 9px; font-size: 12px; }
select, input[type=text] { font: 13px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.check { display: flex; gap: 8px; align-items: center; }
.check input { accent-color: var(--accent); }
.swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.swatches label { display: grid; gap: 3px; font: 10px var(--mono); color: var(--muted); text-align: center; }
input[type=color] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 2px; cursor: pointer; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { padding: 5px 9px; font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
#snap[hidden] { display: none; }
#snap { display: grid; gap: 6px; }
#snap img { border: 1px solid var(--line); border-radius: 4px; }
</style>

<header>
  <h1>Litgrid</h1>
  <p>A grid of cells that lights up with the light in the scene. Move the controls and the stage updates live.</p>
</header>

<div class="app">
  <div class="stage-wrap">
    <div class="stage"><canvas id="stage" width="1920" height="1080" aria-label="Effect preview"></canvas></div>
    <div class="bar">
      <button id="play" class="primary" type="button">Pause</button>
      <label class="file">Use image or video<input id="media" type="file" accept="image/*,video/*"></label>
      <button id="cam" type="button">Use webcam</button>
      <button id="photo" type="button" hidden>Take photo</button>
      <button id="dropMedia" type="button" hidden>Remove media</button>
      <button id="shot" type="button">Freeze frame</button>
      <button id="copy" type="button">Copy settings</button>
      <button id="reset" type="button">Reset</button>
      <span class="stat" id="stat"></span>
    </div>
    <p class="hint" id="note" role="status" hidden></p>
    <div id="snap" hidden>
      <p class="hint">Frozen frame at full size. Right-click (or long-press on mobile) to save the image.</p>
      <img id="snapImg" alt="Frozen frame of the effect">
    </div>
  </div>
  <form class="panel" id="panel" onsubmit="return false"></form>
</div>

<script>
const PRESETS = {
  "Terracotta on night": { bg: "#090b1c", c0: "#161a3a", c1: "#78280e", c2: "#c2410c", c3: "#f08034", c4: "#ffe4c4", bloom: 0.9, bloomWide: 0.35 },
  "Terracotta on black": { bg: "#060505", c0: "#1d1713", c1: "#6a240a", c2: "#c2410c", c3: "#f08034", c4: "#ffe4c4", bloom: 0.9, bloomWide: 0.35 },
  "Violet dusk": { bg: "#05060c", c0: "#1b2350", c1: "#5b2f6e", c2: "#e0502a", c3: "#ff9a5a", c4: "#fff1d6", bloom: 1.1, bloomWide: 0.5 },
  // on light backgrounds the logic turns into ink: the more light in the scene, the more saturated the terracotta on paper
  "Light": { bg: "#ffffff", c0: "#e8e3de", c1: "#f2c6af", c2: "#e07a4a", c3: "#c2410c", c4: "#a3350a", bloom: 0.35, bloomWide: 0.15 },
  "Ink on paper": { bg: "#f3eee6", c0: "#dcd4c9", c1: "#e8b597", c2: "#d4602c", c3: "#b83c0b", c4: "#8c2d08", bloom: 0.25, bloomWide: 0.1 },
};
// each format brings its own layout: side by side on 16:9, stacked on 1:1 and 9:16.
// Sizes are measured against the short side, so they read the same in every format.
const FORMATS = {
  "16:9 1920×1080": { size: [1920, 1080], layout: { textSize: 0.16, textX: 0.36, textY: 0.52, shapeX: 0.75, shapeY: 0.5, shapeSize: 0.15 } },
  "9:16 1080×1920": { size: [1080, 1920], layout: { textSize: 0.14, textX: 0.5, textY: 0.66, shapeX: 0.5, shapeY: 0.45, shapeSize: 0.25 } },
  "1:1 1080×1080": { size: [1080, 1080], layout: { textSize: 0.13, textX: 0.5, textY: 0.74, shapeX: 0.5, shapeY: 0.4, shapeSize: 0.2 } },
};

// every shape is an SVG. Light shapes carry the mode they start in: "tones" uses the SVG's own shades
// (sphere and ring are gradients), "silhouette" lights up the cutout. Cell shapes stretch to fill the cell.
const G = (stops) => `<defs><radialGradient id="g">${stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join("")}</radialGradient></defs>`;
const SV = (vb, body, extra = "") => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${extra}>${body}</svg>`;
const LIGHT_SHAPES = {
  sparkle: { name: "Sparkle", mode: "silhouette", svg: SV("21 46 132 132", '<path stroke="#000" stroke-width="3" stroke-linejoin="round" d="M87 48Q98 101 151 112 98 123 87 176 76 123 23 112 76 101 87 48Z"/>') },
  sphere: { name: "Sphere", mode: "tones", svg: SV("0 0 100 100", G([[0, "#fff"], [0.3, "#c8c8c8"], [0.7, "#4a4a4a"], [1, "#000", 0]]) + '<circle cx="50" cy="50" r="50" fill="url(#g)"/>') },
  ring: { name: "Ring", mode: "tones", svg: SV("0 0 100 100", G([[0, "#000", 0], [0.5, "#000", 0], [0.72, "#fff"], [0.86, "#555"], [1, "#000", 0]]) + '<circle cx="50" cy="50" r="50" fill="url(#g)"/>') },
  square: { name: "Square", mode: "silhouette", svg: SV("0 0 100 100", '<rect x="14" y="14" width="72" height="72"/>') },
  diamond: { name: "Diamond", mode: "silhouette", svg: SV("0 0 100 100", '<path d="M50 2.5 88 50 50 97.5 12 50Z"/>') },
  hourglass: { name: "Hourglass", mode: "silhouette", svg: SV("0 0 100 100", '<path d="M20 2.5H80L53.5 50 80 97.5H20L46.5 50Z"/>') },
};
const STRETCH = ' preserveAspectRatio="none"';
const CELL_SHAPES = {
  square: { name: "Square", svg: SV("0 0 100 100", '<rect width="100" height="100"/>', STRETCH) },
  circle: { name: "Circle", svg: SV("0 0 100 100", '<circle cx="50" cy="50" r="50"/>', STRETCH) },
  diamond: { name: "Diamond", svg: SV("0 0 100 100", '<path d="M50 0 100 50 50 100 0 50Z"/>', STRETCH) },
  cross: { name: "Cross", svg: SV("0 0 99 99", '<path d="M33 0H66V33H99V66H66V99H33V66H0V33H33Z"/>', STRETCH) },
  line: { name: "Horizontal line", svg: SV("0 0 99 99", '<rect y="33" width="99" height="33"/>', STRETCH) },
};
const names = (lib, extra) => Object.assign(Object.fromEntries(Object.entries(lib).map(([k, v]) => [k, v.name])), extra);

const DEFAULTS = {
  svgLight: "", svgCell: "", svgMode: "silhouette",
  format: "16:9 1920×1080", text: "Litgrid", ...FORMATS["16:9 1920×1080"].layout, volume: 0.45,
  light: "sparkle", spin: 0, followMouse: false, smoothing: 0.85,
  trail: true, trailDur: 1.6, trailStrength: 0.8, trailTaper: 0.5, trailSpacing: 0.25,
  deform: true, deformAmount: 1, deformMax: 2.2, ambient: 0.04, overlay: true, mirror: true,
  stepX: 12, stepY: 12, gapX: 2, gapY: 4,
  cellShape: "square", mode: "fixed", offBelow: 0.18, hollowAbove: 0.62, outline: 2, dot: 3, core: 0.55,
  colorSource: "palette", contrast: 1, ...PRESETS["Terracotta on night"], scanlines: 0,
  animate: true, fps: 24, fpsUnlimited: true, pulse: 0.06, drift: 0, flicker: 0.05, flickerEvery: 3,
};

const SCHEMA = [
  ["Scene", [
    ["format", "select", "Format", Object.keys(FORMATS)],
    ["text", "text", "Text"],
    ["textSize", "range", "Text size", 0.05, 0.9, 0.01],
    ["textX", "range", "Text: horizontal", 0, 1, 0.01],
    ["textY", "range", "Text: vertical", 0, 1, 0.01],
    ["volume", "range", "Text volume (darkens toward the bottom)", 0, 1, 0.01],
    ["ambient", "range", "Ambient light", 0, 0.4, 0.01],
    ["overlay", "check", "Text and shape on top of media"],
    ["mirror", "check", "Mirror the webcam"],
  ]],
  ["Shape", [
    ["light", "select", "Shape", [...Object.keys(LIGHT_SHAPES), "custom", "none"], names(LIGHT_SHAPES, { custom: "My SVG", none: "None (text only)" })],
    ["svgPanel", "light"],
    ["svgMode", "select", "The SVG becomes", ["silhouette", "tones"], { silhouette: "Lit silhouette (ignores the SVG colors)", tones: "The SVG's own tones (light lights up, dark stays off)" }],
    ["followMouse", "check", "Follow the mouse (or finger)"],
    ["smoothing", "range", "Follow delay", 0, 0.97, 0.01],
    ["trail", "check", "Trail while following (fading tail)"],
    ["trailDur", "range", "Trail: duration (s)", 0.1, 3, 0.05],
    ["trailStrength", "range", "Trail: strength", 0, 1, 0.01],
    ["trailTaper", "range", "Trail: taper at the tip", 0, 1, 0.01],
    ["trailSpacing", "range", "Trail: spacing between shapes (2 = touching)", 0.1, 5, 0.05],
    ["deform", "check", "Deform with the force of movement"],
    ["deformAmount", "range", "Deform: sensitivity", 0, 3, 0.01],
    ["deformMax", "range", "Deform: max stretch", 1, 4, 0.05],
    ["shapeX", "range", "Horizontal", 0, 1, 0.01],
    ["shapeY", "range", "Vertical", 0, 1, 0.01],
    ["shapeSize", "range", "Size", 0.1, 3, 0.01],
    ["spin", "range", "Spin (turns per second)", -1, 1, 0.01],
  ]],
  ["Cell", [
    ["cellShape", "select", "Cell shape", [...Object.keys(CELL_SHAPES), "custom"], names(CELL_SHAPES, { custom: "My SVG" })],
    ["svgPanel", "cell"],
    ["stepX", "range", "Width (px)", 4, 48, 1],
    ["stepY", "range", "Height (px)", 4, 48, 1],
    ["gapX", "range", "Gap between columns (px)", 0, 16, 1],
    ["gapY", "range", "Gap between rows (px)", 0, 16, 1],
    ["mode", "select", "How brightness becomes a cell", ["fixed", "variable", "solid"], { fixed: "Fixed: off, solid, hollow", variable: "Size follows brightness", solid: "Always solid" }],
    ["offBelow", "range", "Below this, dim dot", 0, 1, 0.01],
    ["hollowAbove", "range", "Above this, hollow", 0, 1.01, 0.01],
    ["outline", "range", "Outline width (px)", 1, 8, 1],
    ["dot", "range", "Dim dot size (px)", 0, 12, 1],
    ["core", "range", "Hollow core brightness", 0, 1, 0.01],
  ]],
  ["Color", [
    ["presets"],
    ["colorSource", "select", "Color source", ["palette", "media"], { palette: "Palette below (by brightness)", media: "Original media color" }],
    ["swatches"],
    ["contrast", "range", "Contrast (brightness curve)", 0.3, 3, 0.01],
  ]],
  ["Glow", [
    ["bloom", "range", "Near glow", 0, 2.5, 0.01],
    ["bloomWide", "range", "Wide glow", 0, 2.5, 0.01],
    ["scanlines", "range", "Scanlines", 0, 0.8, 0.01],
  ]],
  ["Motion", [
    ["animate", "check", "Animate"],
    ["fps", "range", "Frames per second", 4, 60, 1],
    ["fpsUnlimited", "check", "Unlimited fps (as fast as the screen refreshes)"],
    ["pulse", "range", "Shape pulse", 0, 0.4, 0.01],
    ["drift", "range", "Shape drift", 0, 0.4, 0.01],
    ["flicker", "range", "Cell flicker", 0, 0.5, 0.01],
    ["flickerEvery", "range", "Flicker changes every (frames)", 1, 30, 1],
  ]],
];
const SWATCHES = [["bg", "bg"], ["c0", "dark"], ["c1", "low"], ["c2", "mid"], ["c3", "high"], ["c4", "lit"]];

const KEY = "litgrid-v2";
let S = { ...DEFAULTS };
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) S = { ...DEFAULTS, ...saved }; } catch {}
if (!FORMATS[S.format]) S.format = DEFAULTS.format;   // saved format no longer in the list
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

if (matchMedia("(prefers-reduced-motion: reduce)").matches) S.animate = false;

// ---------- panel ----------
const panel = document.getElementById("panel");
const inputs = {}, editors = {}, reports = {};
const SVG_KEY = { light: "svgLight", cell: "svgCell" }, SEL_KEY = { light: "light", cell: "cellShape" }, LIB = { light: LIGHT_SHAPES, cell: CELL_SHAPES };
function svgText(target) {
  const sel = S[SEL_KEY[target]];
  return sel === "custom" ? S[SVG_KEY[target]] : (LIB[target][sel] || Object.values(LIB[target])[0]).svg;
}
function fmt(v, step) { return step >= 1 ? String(Math.round(v)) : Number(v).toFixed(2); }
function buildPanel() {
  panel.innerHTML = "";
  SCHEMA.forEach(([group, fields], gi) => {
    const d = document.createElement("details"); if (gi < 4) d.open = true;
    d.innerHTML = `<summary>${group}</summary>`;
    const box = document.createElement("div"); box.className = "fields"; d.append(box);
    for (const [key, type, label, a, b, c] of fields) {
      if (key === "presets") {
        const p = document.createElement("div"); p.className = "presets";
        for (const name of Object.keys(PRESETS)) {
          const bt = document.createElement("button"); bt.type = "button"; bt.textContent = name;
          bt.onclick = () => { Object.assign(S, PRESETS[name]); syncPanel(); changed(); };
          p.append(bt);
        }
        box.append(p); continue;
      }
      if (key === "svgPanel") {
        const target = type, id = "f-svg-" + target;
        const file = document.createElement("label"); file.className = "file";
        file.innerHTML = `Load .svg file<input type="file" accept=".svg,image/svg+xml">`;
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = `<label for="${id}">SVG code (edit and apply)</label><span></span><textarea id="${id}" rows="5" spellcheck="false"></textarea>`;
        const acts = document.createElement("div"); acts.className = "svg-actions";
        acts.innerHTML = '<button type="button">Apply</button>';
        const msg = document.createElement("p"); msg.className = "hint"; msg.setAttribute("role", "status");
        msg.textContent = "Use shapes and paths only. Images or external fonts inside the SVG won't load.";
        box.append(file, row, acts, msg);
        const ta = row.querySelector("textarea");
        const apply = () => { S[SVG_KEY[target]] = ta.value; S[SEL_KEY[target]] = "custom"; reports[target] = (m) => { msg.textContent = m; }; syncPanel(); changed(); };
        acts.querySelector("button").onclick = apply;
        file.querySelector("input").onchange = async (e) => { const f = e.target.files[0]; if (f) { ta.value = await f.text(); apply(); } };
        editors[target] = ta;
        continue;
      }
      if (key === "swatches") {
        const w = document.createElement("div"); w.className = "swatches";
        for (const [k, l] of SWATCHES) {
          const lab = document.createElement("label"); lab.htmlFor = "f-" + k;
          const inp = document.createElement("input"); inp.type = "color"; inp.id = "f-" + k;
          inp.oninput = () => { S[k] = inp.value; changed(); };
          inputs[k] = { el: inp, type: "color" };
          lab.append(inp, l); w.append(lab);
        }
        box.append(w); continue;
      }
      const row = document.createElement("div");
      if (type === "check") {
        row.className = "check";
        const inp = document.createElement("input"); inp.type = "checkbox"; inp.id = "f-" + key;
        const lab = document.createElement("label"); lab.htmlFor = inp.id; lab.textContent = label;
        inp.onchange = () => { S[key] = inp.checked; changed(); };
        inputs[key] = { el: inp, type };
        row.append(inp, lab); box.append(row); continue;
      }
      row.className = "row";
      const lab = document.createElement("label"); lab.htmlFor = "f-" + key; lab.textContent = label;
      const out = document.createElement("output"); out.htmlFor = "f-" + key;
      let inp;
      if (type === "range") {
        inp = document.createElement("input"); inp.type = "range"; inp.min = a; inp.max = b; inp.step = c;
        inp.oninput = () => { S[key] = +inp.value; out.textContent = fmt(S[key], c); changed(); };
      } else if (type === "select") {
        inp = document.createElement("select");
        for (const o of a) { const op = document.createElement("option"); op.value = o; op.textContent = b ? b[o] : o; inp.append(op); }
        inp.onchange = () => {
          if (key === "light" && LIGHT_SHAPES[inp.value]) S.svgMode = LIGHT_SHAPES[inp.value].mode;
          if (key === "format" && FORMATS[inp.value]) Object.assign(S, FORMATS[inp.value].layout);
          const target = key === "light" ? "light" : key === "cellShape" ? "cell" : null;
          if (target && inp.value === "custom" && !S[SVG_KEY[target]]) S[SVG_KEY[target]] = editors[target].value;   // "My SVG" starts from the current shape
          S[key] = inp.value; syncPanel(); changed();
        };
      } else {
        inp = document.createElement("input"); inp.type = "text"; inp.maxLength = 24;
        inp.oninput = () => { S[key] = inp.value; changed(); };
      }
      inp.id = "f-" + key;
      inputs[key] = { el: inp, type, out, step: c };
      row.append(lab, out, inp); box.append(row);
    }
    panel.append(d);
  });
  syncPanel();
}
function syncPanel() {
  for (const [k, f] of Object.entries(inputs)) {
    if (f.type === "check") f.el.checked = !!S[k];
    else f.el.value = S[k];
    if (f.type === "range") f.out.textContent = fmt(S[k], f.step);
  }
  for (const [target, ta] of Object.entries(editors)) if (document.activeElement !== ta) ta.value = svgText(target);
  playBtn.textContent = S.animate ? "Pause" : "Animate";
}

// ---------- render ----------
const cv = document.getElementById("stage"), ctx = cv.getContext("2d");
// only the canvases read back with getImageData ask for a CPU backing; the rest stay on the GPU
const mk = (read = false) => { const c = document.createElement("canvas"); return [c, c.getContext("2d", read ? { willReadFrequently: true } : undefined)]; };
const [scene, sc] = mk(), [grid, gc] = mk(true), [cells, cc] = mk(), [dots, dc] = mk(), [b1, b1c] = mk(), [b2, b2c] = mk(), [b3, b3c] = mk();
let bgRGB = [0, 0, 0];
let W = 1920, H = 1080, cols = 0, rows = 0, noise = new Float32Array(0), frame = 0, t = 0;
let media = null, mediaW = 0, mediaH = 0, mediaCam = false, stream = null;
const mouse = { x: 0, y: 0, tx: 0, ty: 0, on: false };

  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.srcObject = stream;
  await v.play().catch(() => {});
  setMedia(v, v.videoWidth || 1280, v.videoHeight || 720, true);
  v.onloadedmetadata = () => { mediaW = v.videoWidth; mediaH = v.videoHeight; };
  camBtn.textContent = "Stop webcam"; photoBtn.hidden = false; showNote("");
};
photoBtn.onclick = () => {
  if (!media || !mediaCam) return;
  const c = document.createElement("canvas"); c.width = mediaW; c.height = mediaH;
  c.getContext("2d").drawImage(media, 0, 0, mediaW, mediaH);
  stopCam();
  setMedia(c, mediaW, mediaH, true);
  showNote("Photo taken. The effect now runs on it; “Remove media” goes back to the scene.");
};

buildPanel(); changed();
document.fonts.load('800 100px "Unbounded"').finally(() => { dirty = true; });
requestAnimationFrame(loop);
</script>
