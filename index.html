<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Litgrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Litgrid</h1>
  <p>A grid of cells that lights up with the light in the scene. Move the controls and the stage updates live.</p>
</header>

<div class="app">
  <div class="stage-wrap">
    <div class="stage"><canvas id="stage" width="1920" height="1080" aria-label="Effect preview"></canvas></div>
    <div class="bar">
      <button id="play" class="primary" type="button">Pause</button>
      <label class="file">Use image or video<input id="media" type="file" accept="image/*,video/*"></label>
      <button id="cam" type="button">Use webcam</button>
      <button id="photo" type="button" hidden>Take photo</button>
      <button id="dropMedia" type="button" hidden>Remove media</button>
      <button id="copy" type="button">Copy settings</button>
      <button id="reset" type="button">Reset</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="bar" id="exportBar">
      <span class="hint">Export</span>
      <button id="expPng" type="button">PNG</button>
      <button id="expVideo" type="button">Video</button>
      <button id="expGif" type="button">GIF</button>
      <label class="hint">Length <select id="expSecs"><option>2</option><option selected>4</option><option>6</option><option>10</option></select> s</label>
      <label class="hint">GIF width <select id="expWidth"><option>320</option><option selected>480</option><option>720</option></select> px</label>
    </div>
    <p class="hint" id="note" role="status" hidden></p>
    <div id="snap" hidden>
      <p class="hint" id="snapNote"></p>
      <div id="snapBody"></div>
    </div>
  </div>
  <form class="panel" id="panel" onsubmit="return false"></form>
</div>

<!-- plain scripts, not modules, so the page also opens straight from disk; they share top-level names and load in this order -->
<script src="js/config.js"></script>
<script src="js/panel.js"></script>
<script src="js/render.js"></script>
<script src="js/export.js"></script>
<script src="js/webmcp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
