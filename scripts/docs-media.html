<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>litgrid media</title>
<!-- the editor's font, so the scene text reads as it does in the editor -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Geist:wght@500&family=Geist+Mono:wght@500&display=block">
<style>
  html, body { margin: 0; background: #000; }
  /* the editor's stage: the canvas, with its demo buttons on top for the magnets */
  .stage { display: grid; place-items: center; width: 800px; height: 450px; overflow: hidden; }
  .stage > * { grid-area: 1 / 1; }
  canvas { display: block; width: 100%; height: 100%; }
  .demo { align-self: end; display: flex; gap: 48px; margin-bottom: 40px; }
  .demo[hidden] { display: none; }
  /* the hero's caption: the exact code value of what is on screen, in a corner of every frame */
  .caption {
    align-self: start; justify-self: start; margin: 14px; pointer-events: none;
    font: 500 13px/1 "Geist Mono", ui-monospace, monospace; color: #ebe7e1; white-space: pre;
    background: rgba(9, 11, 28, 0.78); border: 1px solid #22243a; border-radius: 6px; padding: 7px 10px;
  }
  .caption:empty { display: none; }
  /* where a click happens (a screenshot has no mouse pointer): a ring that shrinks as the button goes down */
  .ring {
    position: absolute; left: 0; top: 0; pointer-events: none; box-sizing: border-box; border-radius: 50%;
    /* a dark core between light edges, so it shows on the dark grid and on the bright light alike */
    border: 2px solid rgba(9, 11, 28, 0.85); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.95), inset 0 0 0 1.5px rgba(255, 255, 255, 0.95);
  }
  .ring[hidden] { display: none; }
  .demo button {
    font: 500 15px Geist, system-ui, sans-serif; color: #ebe7e1; background: rgba(0, 0, 0, 0.35);
    border: 1px solid #22243a; border-radius: 999px; padding: 10px 18px;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="lit"></canvas>
  <div class="demo" id="demo" hidden>
    <button type="button" id="cta">Get started</button>
    <button type="button">Pricing</button>
    <button type="button">Docs</button>
  </div>
  <div class="caption" id="caption"></div>
</div>
<div class="ring" id="ring" hidden></div>
<script>
  // the page's time is driven by hand: performance.now and requestAnimationFrame only move when advance() says,
  // so every run sees the same frame times
  (() => {
    let now = 0, id = 0, queue = new Map();
    performance.now = () => now;
    window.requestAnimationFrame = (cb) => { queue.set(++id, cb); return id; };
    window.cancelAnimationFrame = (n) => { queue.delete(n); };
    // ms of time, in frames of a 60 Hz display (16 ms, so that 80 ms is exactly five)
    window.advance = (ms) => {
      for (let left = ms; left > 0; left -= 16) {
        now += Math.min(16, left);
        const due = queue; queue = new Map();
        for (const cb of due.values()) cb(now);
        window.onTick?.(now);
      }
    };
    window.clock = () => now;
  })();
</script>
<script type="module">
  // the package as published: the ES module build in dist/
  const lib = await import("/dist/litgrid.js");
  window.lib = lib;
  // a seeded Math.random, so the grid's flicker noise is the same on every run
  window.seed = (n) => {
    let a = n >>> 0;
    Math.random = () => { a = (a + 0x6d2b79f5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  // starts an instance on the stage; the caller drives the clock. pointer: "window" listens on the window
  // w, h: the stage in CSS pixels; scale: drawing pixels per CSS pixel
  window.mount = (w, h, scale, settings, options = {}) => {
    if (options.pointer === "window") options = { ...options, pointer: window };
    window.seed(1);
    const stage = document.getElementById("stage");
    stage.style.width = `${w}px`; stage.style.height = `${h}px`;
    document.getElementById("demo").hidden = !options.magnets;
    window.lg?.destroy();
    window.caption("");
    Object.assign(ring, { kind: null, at: 0 });
    // onSvgReport is the editor's hook: it says when a new light shape has been decoded (see change)
    window.lg = lib.createLitgrid(document.getElementById("lit"), { size: [w * scale, h * scale], settings, ...options, onSvgReport: (target, msg) => window.svgReport?.(target, msg) });
    window.isReady = false;
    window.lg.ready.then(() => { window.isReady = true; });
  };
  // changes settings; a new light shape decodes in real time, so this resolves only once it is in, before the clock moves
  window.change = (settings) => new Promise((resolve, reject) => {
    if (!("light" in settings)) { window.lg.update(settings); resolve(); return; }
    const timer = setTimeout(() => reject(new Error(`the light shape ${settings.light} did not load`)), 5000);
    window.svgReport = (target, msg) => {
      if (target !== "light") return;
      clearTimeout(timer); window.svgReport = null;
      msg === "SVG applied." ? resolve() : reject(new Error(msg));
    };
    window.lg.update(settings);
  });
  // the click ring: "tap" shrinks and fades, "down" shrinks and stays, "up" grows and fades. It sits where the
  // mouse is (moved by the script, in client pixels, the same as the stage's: the stage is at the page's corner)
  const ring = { kind: null, at: 0, x: 0, y: 0 };
  window.pointerAt = (x, y) => { ring.x = x; ring.y = y; };
  window.click = (call) => {
    ring.kind = { "burst()": "tap", "press(true)": "down", "press(false)": "up" }[call]; ring.at = window.clock();
    if (call === "burst()") window.lg.burst(); else window.lg.press(call === "press(true)");
  };
  const mix = (a, b, k) => a + (b - a) * Math.min(1, Math.max(0, k));
  window.onTick = (now) => {
    const el = document.getElementById("ring"), ms = now - ring.at;
    let r = 0, a = 0;
    if (ring.kind === "tap") { r = ms < 150 ? mix(22, 10, ms / 150) : mix(10, 16, (ms - 150) / 300); a = ms < 150 ? 0.95 : mix(0.95, 0, (ms - 150) / 300); }
    else if (ring.kind === "down") { r = mix(22, 10, ms / 150); a = 0.95; }
    else if (ring.kind === "up") { r = mix(10, 18, ms / 300); a = mix(0.95, 0, ms / 300); }
    el.hidden = !(a > 0);
    Object.assign(el.style, { width: `${2 * r}px`, height: `${2 * r}px`, opacity: a, transform: `translate(${ring.x - r}px, ${ring.y - r}px)` });
  };
  window.caption = (text) => { document.getElementById("caption").textContent = text; };
  window.rect = (sel) => { const r = document.querySelector(sel).getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
  await document.fonts.load('800 100px "Unbounded"');
  await document.fonts.load('500 15px "Geist"');
  await document.fonts.load('500 13px "Geist Mono"');
  window.loaded = true;
</script>
</body>
</html>
