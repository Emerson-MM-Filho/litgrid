# publishes the package to npm from a v* tag, with npm trusted publishing (OIDC): no token anywhere,
# and the provenance statement is generated by npm. On pull requests it runs the same steps with --dry-run.
# The npm trusted publisher must name this file: release.yml.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # the full suite runs here only for a tag; on pull requests ci.yml has already run it
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npx playwright install --with-deps chromium && npm run build:app && npm run build:examples && npm test
        env:
          CI: true
      - name: Dry run
        if: github.event_name == 'pull_request'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm publish --dry-run; then
            echo "Dry run: \`@ampulla/litgrid@$VERSION\` would publish; nothing was published from this pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error title=npm publish --dry-run failed::npm could not pack or validate @ampulla/litgrid@$VERSION (exit code $code). Read the npm output above; run 'npm publish --dry-run' locally to reproduce."
            echo "Dry run: \`@ampulla/litgrid@$VERSION\` **failed**, see the log of the Dry run step." >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error title=Tag and version differ::tag $TAG does not match package.json version $VERSION at this commit. Bump the version in package.json, merge, then tag the merged commit (delete this tag with 'git push --delete origin $TAG' first)."
            echo "Not published: tag \`$TAG\` does not match package.json version \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Tag $TAG matches package.json version $VERSION."
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # the first version is published by hand; its tag only confirms it is there
          if npm view "@ampulla/litgrid@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=Already on npm::@ampulla/litgrid@$VERSION is already on npm; nothing to publish."
            echo "Skipped: \`@ampulla/litgrid@$VERSION\` is already on npm, nothing was published." >> "$GITHUB_STEP_SUMMARY"
          elif npm publish; then
            echo "Published \`@ampulla/litgrid@$VERSION\` to npm: https://www.npmjs.com/package/@ampulla/litgrid/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error title=npm publish failed::@ampulla/litgrid@$VERSION was not published (exit code $code). If npm answered 401/403/404, check that the trusted publisher on npmjs.com names this repository and release.yml; otherwise read the npm output above. Re-run this job once it is fixed."
            echo "Not published: \`npm publish\` of \`@ampulla/litgrid@$VERSION\` failed, see the log of the Publish step." >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
