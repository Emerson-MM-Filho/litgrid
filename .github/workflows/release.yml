# publishes the package to npm when main carries a version that npm does not have yet, with npm trusted
# publishing (OIDC): no token anywhere, and the provenance statement is generated by npm. Then it tags the
# commit v<version> and opens a GitHub release with that version's CHANGELOG entry. The version is chosen in
# the pull request that changes the code (package.json and CHANGELOG.md); merging it is the release.
# On pull requests it runs the same steps with --dry-run, and warns when the package changed without a new version.
# The npm trusted publisher must name this file: release.yml.
name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# two merges in a row publish one after the other, never at the same time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # the v<version> tag and the GitHub release
      id-token: write   # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the pull request check compares with the base branch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@^11.5.1 && npm --version
      - name: Is this version on npm
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@ampulla/litgrid@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@ampulla/litgrid@$VERSION is already on npm."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "@ampulla/litgrid@$VERSION is not on npm yet."
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

      # ---------- pull requests: nothing is published ----------
      - name: Dry run
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm publish --dry-run; then
            echo "Dry run: \`@ampulla/litgrid@$VERSION\` would publish; nothing was published from this pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error title=npm publish --dry-run failed::npm could not pack or validate @ampulla/litgrid@$VERSION (exit code $code). Read the npm output above; run 'npm publish --dry-run' locally to reproduce."
            echo "Dry run: \`@ampulla/litgrid@$VERSION\` **failed**, see the log of the Dry run step." >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
      # a warning, not a failure: several pull requests can go out together in one version
      - name: The package changed without a new version
        if: github.event_name == 'pull_request' && steps.version.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" HEAD -- src vite.config.ts tsconfig.build.json | paste -sd, -)"
          if [ -n "$changed" ]; then
            echo "::warning title=No new version::this pull request changes the package ($changed) but package.json is still at $VERSION, which is already on npm, so merging it publishes nothing. To release it, bump the version (patch for a fix, minor for a new feature or a change in behaviour) and add its entry to CHANGELOG.md."
            echo "Merging publishes nothing: the package changed, but \`$VERSION\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merging publishes nothing: \`$VERSION\` is already on npm and the package did not change." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Merging will publish
        if: github.event_name == 'pull_request' && steps.version.outputs.published == 'false'
        run: |
          echo "Merging this pull request publishes \`@ampulla/litgrid@${{ steps.version.outputs.version }}\` to npm." >> "$GITHUB_STEP_SUMMARY"

      # ---------- main: publish a version npm does not have ----------
      - name: Nothing to publish
        if: github.event_name == 'push' && steps.version.outputs.published == 'true'
        run: |
          echo "Nothing to publish: \`@ampulla/litgrid@${{ steps.version.outputs.version }}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
      - name: The version has its CHANGELOG entry
        if: github.event_name == 'push' && steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error title=No CHANGELOG entry::CHANGELOG.md has no '## $VERSION' section, so $VERSION was not published. Add the entry in a pull request; merging it publishes."
            echo "Not published: CHANGELOG.md has no entry for \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # the full suite runs again before publishing; on pull requests ci.yml has already run it
      - if: github.event_name == 'push' && steps.version.outputs.published == 'false'
        run: npx playwright install --with-deps chromium && npm run build:app && npm run build:examples && npm test
        env:
          CI: true
      - name: Publish
        if: github.event_name == 'push' && steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm publish; then
            echo "Published \`@ampulla/litgrid@$VERSION\` to npm: https://www.npmjs.com/package/@ampulla/litgrid/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error title=npm publish failed::@ampulla/litgrid@$VERSION was not published (exit code $code). If npm answered 401/403/404, check that the trusted publisher on npmjs.com names this repository and release.yml; otherwise read the npm output above. Re-run this job once it is fixed."
            echo "Not published: \`npm publish\` of \`@ampulla/litgrid@$VERSION\` failed, see the log of the Publish step." >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
      # after npm, so a failed publish leaves no tag behind
      - name: Tag and GitHub release
        if: github.event_name == 'push' && steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"; then
            echo "Tagged \`v$VERSION\` and opened its release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error title=Tag or release failed::@ampulla/litgrid@$VERSION is on npm, but the v$VERSION tag or its GitHub release was not created (exit code $code). Create it by hand: gh release create v$VERSION --target $GITHUB_SHA, with the CHANGELOG entry as notes."
            exit $code
          fi
