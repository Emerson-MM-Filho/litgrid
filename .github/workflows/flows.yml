# renders every Mermaid block under docs/, so a broken diagram fails the pull request instead of landing silently
name: Flows

on:
  push:
    paths: ["docs/**", ".github/workflows/flows.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/flows.yml"]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save @mermaid-js/mermaid-cli puppeteer
      - name: Render every Mermaid block
        run: |
          mkdir -p /tmp/mermaid
          for f in $(find docs -name '*.md'); do
            if ! npx mmdc -i "$f" -o "/tmp/mermaid/$(basename "$f")" -p .github/puppeteer.json; then
              echo "::error file=$f,title=Mermaid diagram does not render::a Mermaid block in $f failed to render (the parser error is above). Fix the block, or paste it into https://mermaid.live to find the line."
              exit 1
            fi
          done
          echo "Every Mermaid block under docs/ renders." >> "$GITHUB_STEP_SUMMARY"
